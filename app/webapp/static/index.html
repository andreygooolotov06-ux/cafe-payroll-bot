<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFCF6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Кафе Кабінет ✨</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Loading state -->
    <div id="boot-screen" class="boot-screen">
      <div class="boot-emblem">
        <img src="/icon.svg" alt="" width="72" height="72" />
      </div>
      <div class="boot-title">Кафе Кабінет</div>
      <div class="boot-sub">Завантажуємо робочий простір…</div>
      <div class="shimmer-bar"><span></span></div>
    </div>
  </div>

  <!-- Modal / Bottom Sheet Host -->
  <div id="sheet-backdrop" class="sheet-backdrop hidden" role="dialog" aria-modal="true">
    <div id="sheet-panel" class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3 id="sheet-title" class="sheet-title"></h3>
        <button id="sheet-close" class="icon-btn" type="button" aria-label="Закрити">✕</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <!-- Toast Host -->
  <div id="toast-host" class="toast-host"></div>

  <script src="/static/app.js"></script>
</body>
</html>
